limit_req_zone $binary_remote_addr zone=inkloom_api:10m rate=10r/s;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    error_page 404 /404.html;
    location = /404.html { internal; }
    location = /app { return 308 /app/; }
    location /app/ { try_files $uri /index.html; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location /api/ {
        limit_req zone=inkloom_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 45s;
    }
    location = /health { proxy_pass http://api:8000; }
    location = /ready { proxy_pass http://api:8000; }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri/index.html $uri =404;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }
}
