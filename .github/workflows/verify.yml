name: Verify Markloom
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build && node db-test.mjs
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm exec playwright test --config playwright.loom.config.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-loom-browser-checks
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.8
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run --frozen ruff check app tests && uv run --frozen pytest -q
        working-directory: backend
