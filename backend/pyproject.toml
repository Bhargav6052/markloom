[project]
name = "brand-governance-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi==0.121.1", "uvicorn==0.38.0", "httpx==0.28.1", "pydantic-settings==2.12.0", "python-multipart==0.0.20", "pymupdf==1.26.6", "python-docx==1.2.0", "pillow==12.0.0"]
[dependency-groups]
dev = ["pytest==9.0.0", "pytest-asyncio==1.3.0", "ruff==0.14.4"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
